<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Effect UI Showcase</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="hero">
        <h1>Multi-Effect UI Showcase</h1><br>
        <p>All sections styled without Flexbox</p>
    </header>

    <div class="container">

        <!-- Profile Cards -->
        <section class="section">
            <h2>Layered Profile Cards</h2>

            <div  class="profile-card">

                <div class="profile-card">
                    <div class="profile-img">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTIcduR_8nM7H5drMlBcSiVLHcXehnc0lu1YNinn-vfbw&s"
                            alt="Alice">
                    </div>

                    <h3>Alice</h3>
                    <p>Full Stack Developer</p>
                </div>

                <div class="profile-card">
                    <div class="profile-img">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRCAcjwSJ02O6R1al6KoiT1W7Or82XZZ86wTndDrAJ_Ig&s=10"
                            alt="Bob">
                    </div>

                    <h3>Bob</h3>
                    <p>Frontend Developer</p>
                </div>

            </div>

        </section>

        <!-- Quiz Cards -->

        <section class="section">

            <h2>Quiz Flashcards</h2>
            <section class="quiz-container">

                <div class="quiz-card">
                    <div class="front">What is HTML?</div>
                    <div class="back">HyperText Markup Language</div>
                </div>

                <div class="quiz-card">
                    <div class="front">What is CSS?</div>
                    <div class="back">Cascading Style Sheets</div>
                </div>

            </section>
        </section>

        <!-- Buttons -->

        <section class="section">

            <h2>Creative Buttons</h2>

            <button class="slide-btn">Slide Button</button>
            <button class="glow-btn">Glow Button</button>

        </section>

        <!-- Gallery -->

        <section class="section">

            <h2>Interactive Image Gallery</h2>

            <div class="gallery">

                <div class="image-box">
                    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" alt="">
                </div>

                <div class="image-box">
                    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee" alt="">
                </div>

                <div class="image-box">
                    <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470" alt="">
                </div>

            </div>

        </section>

    </div>
</body>

</html>
