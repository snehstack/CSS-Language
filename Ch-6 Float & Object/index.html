<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Board</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:rgb(105, 104, 104);
        }

        .parent{
            width:800px;
            margin:30px auto;
        }

        .box1{
            width:100px;
            height:100px;
            background:white;
            float:left;
            text-align:center;
            line-height:100px;
            font-size:45px;
        }

        .box2{
            width:100px;
            height:100px;
            background:black;
            color:white;
            float:left;
            text-align:center;
            line-height:100px;
            font-size:45px;
        }

        .clear{
            clear:both;
        }
    </style>
</head>

<body>

<div class="parent">

    <!-- Row 1 -->
    <div class="box1">&#9820;</div>
    <div class="box2">&#9822;</div>
    <div class="box1">&#9821;</div>
    <div class="box2">&#9819;</div>
    <div class="box1">&#9818;</div>
    <div class="box2">&#9821;</div>
    <div class="box1">&#9822;</div>
    <div class="box2">&#9820;</div>
    <div class="clear"></div>

    <!-- Row 2 -->
    <div class="box2">&#9823;</div>
    <div class="box1">&#9823;</div>
    <div class="box2">&#9823;</div>
    <div class="box1">&#9823;</div>
    <div class="box2">&#9823;</div>
    <div class="box1">&#9823;</div>
    <div class="box2">&#9823;</div>
    <div class="box1">&#9823;</div>
    <div class="clear"></div>

    <!-- Row 3 -->
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="clear"></div>

    <!-- Row 4 -->
    <div class="box2"></div>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box1"></div>
    <div class="clear"></div>

    <!-- Row 5 -->
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="clear"></div>

    <!-- Row 6 -->
    <div class="box2"></div>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box1"></div>
    <div class="clear"></div>

    <!-- Row 7 -->
    <div class="box1">&#9817;</div>
    <div class="box2">&#9817;</div>
    <div class="box1">&#9817;</div>
    <div class="box2">&#9817;</div>
    <div class="box1">&#9817;</div>
    <div class="box2">&#9817;</div>
    <div class="box1">&#9817;</div>
    <div class="box2">&#9817;</div>
    <div class="clear"></div>

    <!-- Row 8 -->
    <div class="box2">&#9814;</div>
    <div class="box1">&#9816;</div>
    <div class="box2">&#9815;</div>
    <div class="box1">&#9813;</div>
    <div class="box2">&#9812;</div>
    <div class="box1">&#9815;</div>
    <div class="box2">&#9816;</div>
    <div class="box1">&#9814;</div>
    <div class="clear"></div>

</div>

</body>
</html>
